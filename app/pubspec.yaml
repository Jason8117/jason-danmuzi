name: callmate
description: "CallMate: AI phone assistant that makes calls on your behalf."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  kolbi_core: ^0.1.0
  kolbi_ui: ^0.1.0
  material_ui: ^1.1.0
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
